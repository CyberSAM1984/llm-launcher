<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LLM Launcher · Дашборд</title>
<style>
:root{--bg:#0d1017;--card:#161b26;--card2:#1d2432;--acc:#4f9cf9;--ok:#3fb96f;--err:#e5534b;--warn:#e0a63f;--dim:#7d8799;--tx:#e8ecf3}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--tx);font:15px/1.45 "Segoe UI",system-ui,sans-serif;padding:20px;max-width:1200px;margin:0 auto}
.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px;flex-wrap:wrap;gap:10px}
h1{font-size:20px;font-weight:600}
h1 .v{color:var(--dim);font-size:12px;font-weight:400;margin-left:8px}
.modelname{font-size:26px;font-weight:700;color:var(--acc)}
.modelname .dot{display:inline-block;width:12px;height:12px;border-radius:50%;background:var(--ok);box-shadow:0 0 10px var(--ok);margin-right:8px}
.modelname.off .dot{background:#444;box-shadow:none}
.sub{color:var(--dim);font-size:13px;margin-top:2px}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px;margin-bottom:20px}
.tile{background:var(--card);border:1px solid #232b3a;border-radius:14px;padding:18px}
.tile .lbl{color:var(--dim);font-size:12px;text-transform:uppercase;letter-spacing:.5px;margin-bottom:8px}
.tile .val{font-size:30px;font-weight:700;line-height:1}
.tile .unit{font-size:14px;color:var(--dim);font-weight:400;margin-left:4px}
.tile .extra{color:var(--dim);font-size:12px;margin-top:6px}
.tile.gen .val{color:var(--acc)}
.tile.gpu .val{color:var(--warn)}
.tile.vram .val{color:var(--ok)}
.bar{height:6px;background:#232b3a;border-radius:3px;margin-top:10px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--ok);border-radius:3px;transition:width .5s}
.bar i.hot{background:var(--warn)}
.bar i.crit{background:var(--err)}
.models{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:20px}
.mchip{background:var(--card);border:1px solid #232b3a;border-radius:12px;padding:12px 16px;cursor:pointer;transition:.15s;min-width:150px}
.mchip:hover{border-color:var(--acc)}
.mchip.run{border-color:var(--ok);background:var(--card2)}
.mchip .n{font-weight:600;font-size:15px}
.mchip .n::after{content:"";color:var(--ok)}
.mchip.run .n::after{content:" ✓"}
.mchip .m{color:var(--dim);font-size:12px;margin-top:3px}
.mchip .btn{margin-top:8px;font-size:12px;color:var(--acc)}
.mchip.run .btn{color:var(--ok)}
.actions{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px}
button{background:var(--card2);border:1px solid #2c3546;color:var(--tx);padding:10px 18px;border-radius:10px;font-size:14px;cursor:pointer;transition:.15s}
button:hover{border-color:var(--acc);filter:brightness(1.1)}
button:disabled{opacity:.4;cursor:default}
button.pri{background:var(--acc);border-color:var(--acc);color:#fff}
#out{background:var(--card);border:1px solid #232b3a;border-radius:12px;padding:14px 18px;color:var(--dim);font-size:14px;white-space:pre-wrap;display:none}
#out.show{display:block}
.spin{display:inline-block;animation:rot 1s linear infinite}
@keyframes rot{to{transform:rotate(360deg)}}
.err{color:var(--err)}
</style>
</head>
<body>
<div class="top">
  <div>
    <h1>🦙 LLM Launcher<span class="v">Вариант 1 · Дашборд</span></h1>
    <div class="modelname" id="mname"><span class="dot"></span>—</div>
    <div class="sub" id="msub"></div>
  </div>
</div>
<div class="tiles">
  <div class="tile gen"><div class="lbl">Скорость генерации</div><div class="val" id="t_speed">—<span class="unit">tok/s</span></div><div class="extra" id="t_speed_x"></div></div>
  <div class="tile gpu"><div class="lbl">Загрузка GPU</div><div class="val" id="t_gpu">—<span class="unit">%</span></div><div class="bar"><i id="b_gpu"></i></div></div>
  <div class="tile vram"><div class="lbl">VRAM</div><div class="val" id="t_vram">—<span class="unit">МБ</span></div><div class="bar"><i id="b_vram"></i></div><div class="extra" id="t_vram_x"></div></div>
  <div class="tile"><div class="lbl">Последний запрос</div><div class="val" id="t_last">—</div><div class="extra" id="t_last_x"></div></div>
</div>
<div class="models" id="models"></div>
<div class="actions">
  <button class="pri" id="b_speed" onclick="speed()">⚡ Замерить скорость</button>
  <button id="b_test" onclick="test()">Проверить ответ</button>
  <button id="b_log" onclick="showlog()">Лог сервера</button>
  <button id="b_vram" onclick="showvram()">Кто ест VRAM</button>
  <button id="b_stop" onclick="stop()">Остановить</button>
</div>
<div id="out"></div>
<script>
async function api(p,b){const o=b?{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(b)}:{};return (await fetch(p,o)).json()}
function esc(s){const d=document.createElement('div');d.textContent=s==null?'':String(s);return d.innerHTML}
function fmtCtx(n){if(!n)return '?';return n%1024===0?(n/1024)+'K':String(n)}
let S=null;
async function refresh(){
  let s;try{s=await api('/api/status')}catch(e){return}
  S=s;
  const mn=document.getElementById('mname'),ms=document.getElementById('msub');
  if(s.action==='switching'){mn.innerHTML='<span class="spin">⟳</span> Загрузка '+(s.target_alias||'')+'…';mn.className='modelname off';ms.textContent=s.action_elapsed+' с';}
  else if(s.llama.running){mn.innerHTML='<span class="dot"></span>'+esc(s.llama.alias);mn.className='modelname';ms.textContent=(s.llama.quant||'')+' · контекст '+fmtCtx(s.llama.n_ctx);}
  else if(s.llama.loading){mn.innerHTML='<span class="spin">⟳</span> Модель грузится…';mn.className='modelname off';ms.textContent='';}
  else{mn.innerHTML='<span class="dot"></span>Сервер остановлен';mn.className='modelname off';ms.textContent='';}
  const m=s.metrics||{};
  const sp=document.getElementById('t_speed');
  if(m.busy>0){sp.innerHTML='<span class="spin">⟳</span>';document.getElementById('t_speed_x').textContent='генерация…';}
  else if(m.gen_tps){sp.innerHTML=m.gen_tps+'<span class="unit">tok/s</span>';document.getElementById('t_speed_x').textContent=m.prompt_tps?('промпт '+m.prompt_tps+' tok/s'):'';}
  else{sp.innerHTML='—<span class="unit">tok/s</span>';document.getElementById('t_speed_x').textContent='';}
  const g=s.vram?s.vram.util:null;
  document.getElementById('t_gpu').innerHTML=(g==null?'—':g)+'<span class="unit">%</span>';
  const bg=document.getElementById('b_gpu');bg.style.width=(g||0)+'%';bg.className=g>80?'crit':(g>50?'hot':'');
  if(s.vram){document.getElementById('t_vram').innerHTML=s.vram.used_mb+'<span class="unit">МБ</span>';
    const pct=Math.round(s.vram.used_mb/s.vram.total_mb*100);
    const bv=document.getElementById('b_vram');bv.style.width=pct+'%';bv.className=pct>90?'crit':(pct>75?'hot':'');
    document.getElementById('t_vram_x').textContent='из '+s.vram.total_mb+' МБ ('+pct+'%)';}
  const tl=document.getElementById('t_last');
  if(m.last_s){tl.innerHTML=m.last_s+'<span class="unit">с</span>';document.getElementById('t_last_x').textContent=m.last_tok?(m.last_tok+' токенов'):'';}
  else{tl.textContent='—';document.getElementById('t_last_x').textContent='';}
  document.getElementById('models').innerHTML=s.models.map(x=>{
    const run=s.llama.running&&s.llama.alias===x.alias;
    return '<div class="mchip'+(run?' run':'')+'" onclick="'+(run?'':'launch(\''+x.bat+'\')')+'">'+
      '<div class="n">'+esc(x.alias)+'</div><div class="m">'+esc(x.quant)+' · '+fmtCtx(x.ctx)+' · '+esc(x.size)+'</div>'+
      '<div class="btn">'+(run?'Запущена':(s.llama.running?'Переключиться':'Запустить'))+'</div></div>';
  }).join('');
  const dis=!s.llama.running||!!s.action;
  ['b_speed','b_test','b_stop'].forEach(id=>document.getElementById(id).disabled=dis);
}
async function launch(b){await api('/api/launch',{bat:b});refresh()}
async function stop(){if(confirm('Остановить сервер?')){await api('/api/stop',{});refresh()}}
function out(html){const e=document.getElementById('out');e.innerHTML=html;e.className='show';e.scrollIntoView({behavior:'smooth',block:'nearest'})}
async function speed(){out('<span class="spin">⟳</span> Замеряю скорость (64 токена)…');const r=await api('/api/speed',{});
  out(r.ok?('⚡ Генерация: <b>'+r.gen_tps+' tok/s</b> ('+r.gen_tokens+' ток. за '+r.gen_ms+' мс) · Промпт: '+r.prompt_tps+' tok/s · всего '+r.wall_s+' с'):('<span class="err">❌ '+esc(r.error)+'</span>'))}
async function test(){out('<span class="spin">⟳</span> Тестовый запрос…');const r=await api('/api/test',{});
  out(r.ok?('✅ '+esc(r.content)+(r.tps?(' · '+r.tps+' tok/s · '+r.elapsed+' с'):'')):('<span class="err">❌ '+esc(r.error)+'</span>'))}
async function showlog(){const e=document.getElementById('out');if(e.className==='show'&&e.dataset.m==='log'){e.className='';return}
  e.dataset.m='log';e.textContent='…';const r=await api('/api/log');e.textContent=r.lines;e.className='show'}
async function showvram(){const e=document.getElementById('out');if(e.className==='show'&&e.dataset.m==='vram'){e.className='';return}
  e.dataset.m='vram';e.textContent='…';const r=await api('/api/vram_procs');
  const L=[];const tot=r.vram?r.vram.used_mb:0;
  if(r.vram)L.push('Всего занято: '+r.vram.used_mb+' / '+r.vram.total_mb+' МБ (свободно '+(r.vram.total_mb-r.vram.used_mb)+' МБ)\n');
  const rows=(r.procs||[]).map(p=>({l:p.name+' (pid '+p.pid+')',mb:p.mb}));
  const sum=rows.reduce((a,x)=>a+x.mb,0);if(tot&&sum<tot)rows.push({l:'прочие',mb:tot-sum});
  const w=Math.max(34,...rows.map(x=>x.l.length))+2;
  L.push('Процесс'.padEnd(w)+'VRAM'.padStart(9)+'   доля');L.push('─'.repeat(w+16));
  rows.forEach(x=>{const p=tot?Math.round(x.mb/tot*100):0;L.push(x.l.padEnd(w)+(x.mb+' МБ').padStart(9)+'   '+String(p).padStart(3)+'%')});
  e.textContent=L.join('\n');e.className='show'}
setInterval(refresh,2000);refresh();
</script>
</body>
</html>
