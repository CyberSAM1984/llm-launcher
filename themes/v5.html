<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LLM Launcher · Минимализм</title>
<style>
:root{--bg:#0e1116;--card:#171c24;--line:#242c38;--tx:#e7ebf2;--dim:#8a93a5;--acc:#5b8def;--ok:#3fb96f;--err:#e5534b}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--tx);font:15px/1.5 "Segoe UI",system-ui,sans-serif;padding:28px;max-width:980px;margin:0 auto}
.statusline{display:flex;align-items:center;gap:14px;flex-wrap:wrap;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 20px;margin-bottom:24px;font-size:15px}
.statusline .dot{width:10px;height:10px;border-radius:50%;background:var(--ok);box-shadow:0 0 8px var(--ok);flex-shrink:0}
.statusline.off .dot{background:#444;box-shadow:none}
.statusline .sep{color:#333c4a}
.statusline .dim{color:var(--dim)}
.statusline b{font-weight:600}
.statusline .err{color:var(--err)}
h1{font-size:15px;color:var(--dim);font-weight:400;margin-bottom:14px}
h1 .v{font-size:12px}
.models{display:flex;flex-direction:column;gap:8px;margin-bottom:24px}
.mrow{display:flex;align-items:center;gap:14px;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px 18px;cursor:pointer;transition:.15s}
.mrow:hover{border-color:var(--acc)}
.mrow.run{border-color:var(--ok)}
.mrow .n{font-weight:600;min-width:170px}
.mrow.run .n::after{content:" ✓";color:var(--ok)}
.mrow .m{color:var(--dim);font-size:13px;flex:1}
.mrow .a{font-size:13px;color:var(--acc)}
.mrow.run .a{color:var(--ok)}
.actions{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:18px}
button{background:var(--card);border:1px solid var(--line);color:var(--tx);padding:9px 16px;border-radius:9px;font-size:14px;cursor:pointer}
button:hover{border-color:var(--acc)}
button:disabled{opacity:.4;cursor:default}
button.pri{background:var(--acc);border-color:var(--acc);color:#fff}
#out{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px 18px;color:var(--dim);font-size:14px;white-space:pre-wrap;display:none}
#out.show{display:block}
.spin{display:inline-block;animation:rot 1s linear infinite}
@keyframes rot{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<h1>🦙 LLM Launcher <span class="v">· Вариант 5 · Минимализм</span></h1>
<div class="statusline" id="sline"><span class="dot"></span><span class="dim">…</span></div>
<div class="models" id="models"></div>
<div class="actions">
  <button class="pri" id="b_speed" onclick="speed()">⚡ Замерить скорость</button>
  <button id="b_test" onclick="test()">Проверить ответ</button>
  <button id="b_log" onclick="showlog()">Лог</button>
  <button id="b_vram" onclick="showvram()">VRAM</button>
  <button id="b_stop" onclick="stop()">Остановить</button>
</div>
<div id="out"></div>
<script>
async function api(p,b){const o=b?{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(b)}:{};return (await fetch(p,o)).json()}
function esc(s){const d=document.createElement('div');d.textContent=s==null?'':String(s);return d.innerHTML}
function fmtCtx(n){if(!n)return '?';return n%1024===0?(n/1024)+'K':String(n)}
async function refresh(){
  let s;try{s=await api('/api/status')}catch(e){return}
  const sl=document.getElementById('sline');
  const m=s.metrics||{},v=s.vram;
  let parts=[];
  if(s.action==='switching'){sl.className='statusline off';parts=['<span class="spin">⟳</span> Загрузка <b>'+esc(s.target_alias||'')+'</b>… '+s.action_elapsed+'с'];}
  else if(s.llama.running){sl.className='statusline';
    parts=['<b>'+esc(s.llama.alias)+'</b>','<span class="dim">'+esc(s.llama.quant)+' · '+fmtCtx(s.llama.n_ctx)+'</span>'];
    if(m.busy>0)parts.push('<span class="spin">⟳</span> генерация… GPU '+(v?v.util:'?')+'%');
    else if(m.gen_tps){parts.push('<b>'+m.gen_tps+' tok/s</b>');if(m.last_s)parts.push('<span class="dim">'+m.last_s+' с'+(m.last_tok?' · '+m.last_tok+' ток.':'')+'</span>');}
    if(v)parts.push('<span class="dim">VRAM '+v.used_mb+'/'+v.total_mb+' · GPU '+v.util+'%</span>');}
  else if(s.llama.loading){sl.className='statusline off';parts=['<span class="spin">⟳</span> Модель грузится…'];}
  else{sl.className='statusline off';parts=['<span class="dim">Сервер остановлен</span>'];}
  if(s.error)parts.push('<span class="err">⚠ '+esc(s.error)+'</span>');
  sl.innerHTML='<span class="dot"></span>'+parts.join('<span class="sep">│</span>');
  document.getElementById('models').innerHTML=s.models.map(x=>{
    const run=s.llama.running&&s.llama.alias===x.alias;
    return '<div class="mrow'+(run?' run':'')+'" onclick="'+(run?'':'launch(\''+x.bat+'\')')+'">'+
      '<span class="n">'+esc(x.alias)+'</span><span class="m">'+esc(x.quant)+' · '+fmtCtx(x.ctx)+' · '+esc(x.size)+'</span>'+
      '<span class="a">'+(run?'Запущена':(s.llama.running?'Переключиться':'Запустить'))+'</span></div>';
  }).join('');
  const dis=!s.llama.running||!!s.action;
  ['b_speed','b_test','b_stop'].forEach(id=>document.getElementById(id).disabled=dis);
}
async function launch(b){await api('/api/launch',{bat:b});refresh()}
async function stop(){if(confirm('Остановить сервер?')){await api('/api/stop',{});refresh()}}
function out(html){const e=document.getElementById('out');e.innerHTML=html;e.className='show';e.scrollIntoView({behavior:'smooth',block:'nearest'})}
async function speed(){out('<span class="spin">⟳</span> Замеряю скорость (64 токена)…');const r=await api('/api/speed',{});
  out(r.ok?('⚡ Генерация: <b>'+r.gen_tps+' tok/s</b> ('+r.gen_tokens+' ток. за '+r.gen_ms+' мс) · Промпт: '+r.prompt_tps+' tok/s · всего '+r.wall_s+' с'):('<span class="err">❌ '+esc(r.error)+'</span>'))}
async function test(){out('<span class="spin">⟳</span> Тестовый запрос…');const r=await api('/api/test',{});
  out(r.ok?('✅ '+esc(r.content)+(r.tps?(' · '+r.tps+' tok/s · '+r.elapsed+' с'):'')):('<span class="err">❌ '+esc(r.error)+'</span>'))}
async function showlog(){const e=document.getElementById('out');if(e.className==='show'&&e.dataset.m==='log'){e.className='';return}
  e.dataset.m='log';e.textContent='…';const r=await api('/api/log');e.textContent=r.lines;e.className='show'}
async function showvram(){const e=document.getElementById('out');if(e.className==='show'&&e.dataset.m==='vram'){e.className='';return}
  e.dataset.m='vram';e.textContent='…';const r=await api('/api/vram_procs');
  const L=[];const tot=r.vram?r.vram.used_mb:0;
  if(r.vram)L.push('Всего занято: '+r.vram.used_mb+' / '+r.vram.total_mb+' МБ (свободно '+(r.vram.total_mb-r.vram.used_mb)+' МБ)\n');
  const rows=(r.procs||[]).map(p=>({l:p.name+' (pid '+p.pid+')',mb:p.mb}));
  const sum=rows.reduce((a,x)=>a+x.mb,0);if(tot&&sum<tot)rows.push({l:'прочие',mb:tot-sum});
  const w=Math.max(34,...rows.map(x=>x.l.length))+2;
  L.push('Процесс'.padEnd(w)+'VRAM'.padStart(9)+'   доля');L.push('─'.repeat(w+16));
  rows.forEach(x=>{const p=tot?Math.round(x.mb/tot*100):0;L.push(x.l.padEnd(w)+(x.mb+' МБ').padStart(9)+'   '+String(p).padStart(3)+'%')});
  e.textContent=L.join('\n');e.className='show'}
setInterval(refresh,2000);refresh();
</script>
</body>
</html>
